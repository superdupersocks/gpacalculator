name: Admissions indexing check
# Reads what the live site gives search engines for /admissions/ (robots.txt, the sitemap index and every sitemap,
# and the addresses in data/admissions/live_checks/indexing_urls.txt, without following redirects) with
# scripts/admissions/indexing_check.py, and commits indexing.md, sitemap_colleges.csv and sitemap_other.csv to
# data/admissions/live_checks/. Runs on GitHub because the cloud sessions can't reach the site. Read-only GETs;
# changes nothing on the site.
on:
  workflow_dispatch:
  push:
    branches: ['claude/admissions-**']
    paths:
      - 'scripts/admissions/indexing_check.py'
      - 'data/admissions/live_checks/indexing_urls.txt'
      - '.github/workflows/admissions-indexing.yml'
permissions:
  contents: write
concurrency:
  group: admissions-indexing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/admissions/indexing_check.py data/admissions/live_checks/indexing_urls.txt data/admissions/live_checks
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admissions/live_checks/indexing.md data/admissions/live_checks/sitemap_colleges.csv data/admissions/live_checks/sitemap_other.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          # [skip ci]: GitHub holds QA runs on this bot's commits for a maintainer's approval, and QA doesn't
          # read data/admissions/.
          git commit -m "Record what the live site gives search engines for /admissions/ [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
