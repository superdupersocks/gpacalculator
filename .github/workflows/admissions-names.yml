name: Admissions name history
# Downloads the IPEDS directory files HD2002-HD2023 from ed.gov, which the cloud sessions can't reach, and commits
# every name each college has carried since 2002 (scripts/admissions/ipeds_names.py) to
# data/admissions/review/ipeds_names.csv, for the Phase 3 names check. Changes nothing on the site.
on:
  workflow_dispatch:
  push:
    branches: ['claude/admissions-**']
    paths:
      - 'scripts/admissions/ipeds_names.py'
      - '.github/workflows/admissions-names.yml'
permissions:
  contents: write
concurrency:
  group: admissions-names-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/admissions/ipeds_names.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admissions/review/ipeds_names.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          # [skip ci]: GitHub holds QA runs on this bot's commits for a maintainer's approval, and QA doesn't
          # read data/admissions/.
          git commit -m "Refresh the IPEDS name history [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
