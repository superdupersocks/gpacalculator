name: Admissions page snapshot
# Saves the live pages listed in data/admissions/preview/urls.txt, plus the site files they load (stylesheets,
# scripts, fonts, small images), with scripts/design/snapshot.py, and commits them to data/admissions/preview/snapshot/.
# Phase 3 renders its before/after screenshots from this copy, since the cloud sessions can't reach the site.
# Read-only GETs; changes nothing on the site.
on:
  workflow_dispatch:
  push:
    branches: ['claude/admissions-**']
    paths:
      - 'data/admissions/preview/urls.txt'
      - '.github/workflows/admissions-snapshot.yml'
permissions:
  contents: write
concurrency:
  group: admissions-snapshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Snapshot
        run: |
          rm -rf data/admissions/preview/snapshot
          python scripts/design/snapshot.py data/admissions/preview/snapshot $(grep -v '^#' data/admissions/preview/urls.txt | grep .)
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/admissions/preview/snapshot
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          # [skip ci]: GitHub holds QA runs on this bot's commits for a maintainer's approval.
          git commit -m "Save live admissions pages for the Phase 3 previews [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
